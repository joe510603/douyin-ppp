# 留言 / 私信话术库
#
# 怎么选：先看「弹幕原文」里有没有命中某条的 keywords（从上往下，先命中先用），
#        都没命中就看车型（有车型走 model，只提了车型没问具体问题），
#        最后兜底 generic。
# 占位符：{salutation} 称呼、{car} 车型、{store} 门店
#
# text     = 评论区留言（要短，60 字内，别像广告）
# variants = 同一角度的多个说法，运行时随机挑（60% 用 text，40% 随机变体）
#            为什么要变体：几百个客户发一模一样的评论，平台容易判定批量 spam
# dm_text  = 私信正文（可以长一点，120 字内；对方回复/关注前只能发一条，所以要一次说清）
#
# 铁律：
#  1. 评论区不出现「微信/电话/手机号/加我」这类字眼（平台会限流甚至封号），
#     引导留联系方式是私信和对方回复之后的事。
#  2. 不要自称「小米汽车门店」——按运营要求，只说「我这边可以对比下」。
#  3. **不要编造客户没问过的事**。客户只说了「su7」，就不能回「看到你问价格」——
#     对方点进主页看到会莫名其妙。弹幕没问具体问题时走 model 角度。

salutation_default: 老板

# 表里「车型」字段可能是内部代号/配置名，统一翻译成用户听得懂的说法
car_alias:
  SU7: SU7
  YU7: YU7
  MAX: SU7 Max
  PRO: SU7 Pro
  ULTRA: SU7 Ultra
  N90: 小米汽车
  N70: 小米汽车
  "": 小米汽车

# 从弹幕原文里认车型（子串，忽略大小写）
# 只作为兜底——首选规则引擎的 extract_model，
# 它分得清「su7max」（SU7）和「N70 Max」（N70，不是 SU7 Max）。
car_patterns:
  - ['yu7', 'YU7']
  - ['su7', 'SU7']
  - ['max', 'SU7 Max']
  - ['pro', 'SU7 Pro']

templates:
  - id: price
    # 词表要和规则引擎的「价格询问」信号对齐，
    # 否则会出现「su7max现在什么价位了」这种真实问价却落到车型兜底的情况。
    # 「免息/补贴/权益/折扣/降价/以旧换新」也归这里——
    # 规则引擎把它们算作「金融补贴」，是同一种购买决策（钱）。
    keywords: [落地, 价格, 多少钱, 优惠, 报价, 分期, 首付, 贷款, 置换,
               价位, 多少米, 什么价, 值多少, 裸车, 全款, 车价, 成交价, 优惠价, 贵不贵,
               免息, 补贴, 权益, 折扣, 降价, 以旧换新, 优惠幅度, 便宜多少]
    text: "{salutation}，看到你在直播间问{car}的价格，可以找我了解下，我这边能给你对比个落地价～"
    variants:
      - "{salutation}，你在直播间问{car}的价格对吧？我这边能帮你算个落地价，有空可以看看～"
      - "{salutation}，看到你问{car}多少钱，这个我这边可以给你报个落地价，比自己问方便～"
      - "{salutation}，{car}的价格我可以帮你对一下，有具体想看的配置吗？"
      - "{salutation}，{car}的价格我能给你算清楚，落地多少、能省多少都能说～"
      - "{salutation}，想了解{car}多少钱的话找我，我把落地价给你列出来～"
      - "{salutation}，{car}现在有什么优惠我可以帮你看，能省多少也一起算给你～"
      - "{salutation}，{car}现在什么价我给你说清楚，分期全款都能算～"
      - "{salutation}，想聊{car}的话我这边比较懂，行情和优惠都能给你说说～"
    dm_text: "{salutation}，刚看到你在直播间问{car}的价格。我这边可以帮你对比下落地价，你把想要的配置发我，我给你算个明细，参考一下再决定～"

  # 客户在纠结选哪个版本 → 给版本建议，别泛泛地聊价格
  # 放在 config 前面：版本决策比选装/颜色更明确
  - id: version
    keywords: [版本, 哪个版本, 有哪些版本, 有什么区别, 区别, 选哪个, 标准版, 差多少, 选哪款]
    text: "{salutation}，{car}几个版本怎么选我这边能给你对一下，主要差在配置和价格～"
    variants:
      - "{salutation}，{car}选哪个版本合适我可以帮你分析下，差价和配置都给你列出来～"
      - "{salutation}，{car}几个版本的区别我能讲清楚，你更看重配置还是价格？"
      - "{salutation}，想知道{car}版本怎么选吗？我这边可以按你需求给建议～"
    dm_text: "{salutation}，刚看到你在直播间纠结{car}选哪个版本。我这边可以把各版本的配置和差价给你列个明细，你说说更看重什么，我帮你挑一个合适的～"

  - id: config
    keywords: [颜色, 配置, 轮毂, 内饰, 选装, 科技包, 珍珠白, 靛石绿, 加装]
    text: "{salutation}，看你关注{car}的配置，选装和提车周期我这边都能帮你确认，价格也能一起对比下～"
    variants:
      - "{salutation}，你在问{car}的配置对吧？选装和提车周期我都能帮你确认～"
      - "{salutation}，看到你关注{car}的选装，这块我熟，有想看的可以问我～"
      - "{salutation}，{car}的配置和价格我这边都能对，有兴趣可以聊聊～"
      - "{salutation}，{car}想要什么颜色和选装我都能帮你确认，周期和价格一起给你对～"
    dm_text: "{salutation}，刚看到你在直播间问{car}的配置。选装、颜色、提车周期我这边都能帮你确认，价格也能一起对比，有想了解的随时问我～"

  - id: delivery
    keywords: [提车, 交付, 多久, 现车, 排队, 什么时候到, 到车, 订车, 下单, 定金, 库存, 排产, 提车周期]
    text: "{salutation}，看到你问{car}的提车时间，我这边能帮你查交付节奏，价格也能一起对比下～"
    variants:
      - "{salutation}，你在问{car}多久能提车对吧？我这边能帮你查下现在的交付节奏～"
      - "{salutation}，看到你问{car}的现车和排产，这个我可以帮你查，有消息我告诉你～"
      - "{salutation}，{car}的提车周期和价格我都能帮你问，具体的可以聊聊～"
    dm_text: "{salutation}，刚看到你在问{car}的提车时间。我这边能帮你查下最新的交付节奏，价格也可以一起对比，需要的话随时找我～"

  - id: testdrive
    keywords: [试驾, 看车, 到店, 体验]
    text: "{salutation}，看到你想了解{car}，想试驾的话可以找我，配置和价格我这边都能对比清楚～"
    variants:
      - "{salutation}，你在问{car}试驾的事对吧？我这边可以安排，配置价格也能一起对比～"
      - "{salutation}，看到你想到店看{car}，我这边能帮你安排时间～"
      - "{salutation}，{car}想试驾的话找我，配置和落地价我给你讲清楚～"
    dm_text: "{salutation}，刚看到你在直播间想了解{car}。想试驾或者想先对比下价格都可以找我，配置和落地价我帮你算清楚～"

  # 客户只提了车型、没问具体问题 → 用这个角度：具体但不编造
  - id: model
    keywords: []
    text: "{salutation}，看到你在直播间关注{car}，我这边能帮你对比下价格和配置，有想看的可以问我～"
    variants:
      - "{salutation}，看到你关注{car}了，价格和配置我这边都能给你对比下～"
      - "{salutation}，{car}有什么想了解的可以问我，价格配置我都能对一下～"
      - "{salutation}，看到你在看{car}，有想了解的我这边都能帮你问问～"
    dm_text: "{salutation}，刚看到你在直播间关注{car}。价格、配置、提车周期我这边都能帮你对比，有想了解的可以直接问我～"

  - id: generic
    keywords: []
    text: "{salutation}，看到你在直播间咨询小米汽车，可以找我了解下，我这边能帮你对比个价格～"
    variants:
      - "{salutation}，看到你在直播间问小米汽车，有想了解的我这边都能帮你对比下～"
      - "{salutation}，小米汽车这边价格配置我都能帮你对，有想问的随时说～"
      - "{salutation}，看到你关注小米汽车了，有需要可以找我了解下～"
      - "{salutation}，小米汽车这边你还想了解啥？价格、配置、提车我都能说清楚～"
      - "{salutation}，看到你在看小米汽车，具体想了解哪款我这边都能给你讲讲～"
    dm_text: "{salutation}，刚看到你在直播间咨询小米汽车。价格、配置、提车周期我这边都能帮你对比，有想了解的可以直接问我～"

# 出现这些词就说明文案越界了，直接判为不可发送
forbidden_words: [微信, 电话, 手机号, 加我, vx, VX, 私聊我, 留个联系方式]
