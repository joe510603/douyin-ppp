app:
  name: douyin-ppp
  host: 0.0.0.0
  port: 9527
  debug: false
douyin:
  cookie: ''  # 在 Web 界面配置页面自动获取，或手动填写抖音 Cookie
  cookie_expire_warning_hours: 24
  websocket_url_template: ''
douyin_video:
  cookie: ''  # 用于视频评论抓取的独立 Cookie，建议使用完整 Cookie（包含 sessionid 等）
  cookie_expire_warning_hours: 24
monitors:
- name: 示例账号
  sec_user_id: ''  # 抖音用户 sec_user_id，在 Web 界面添加
  room_id: ''
  websocket_url: ''
  enabled: true
  tags: []
live_detection:
  interval: 60
  timeout: 15
  max_failures: 5
  retry_interval: 300
websocket:
  heartbeat_interval: 5
  reconnect_initial_delay: 2
  reconnect_max_delay: 60
  max_reconnect_attempts: 0
  log_unknown_messages: false
storage:
  db_path: data/db/douyin_ppp.db
  export_dir: data/exports
  flush_interval: 10
  excel_max_rows: 100000
logging:
  level: INFO
  file_path: data/logs/app.log
  rotation: 50 MB
  retention: 7 days
llm:
  enabled: false           # 总开关
  provider: minimax        # openai / deepseek / minimax / minimax_intl / local
  api_key: ''              # MiniMax Coding Plan 的 API Key
  base_url: ''             # 留空则按 provider 自动填（minimax → https://api.minimaxi.com/v1）
  model: MiniMax-M3
  max_cost_per_batch: 0.5
  daily_budget: 10.0
  features:
    sentiment: true
    intent: true
    competitor: false
    user_profile: false
  batch_size: 50
  timeout: 60
  max_tokens: 4000
  temperature: 0.2
lead:
  enabled: false           # 购车意向筛选总开关
  min_intent_level: medium # high / medium / low
  lookback_hours: 24
  scan_interval: 300
  batch_size: 20
  daily_call_limit: 200
  contact_priority: true
notify:
  enabled: false           # 飞书群通知开关
  webhook_url: ''          # https://open.feishu.cn/open-apis/bot/v2/hook/xxx
  secret: ''               # 群机器人「签名校验」密钥（可选）
  push_levels: [high, medium]
  contact_only: false
  max_per_message: 5
  mark_pushed: true
  # ---- 多维表格（线索表）----
  bitable_enabled: false
  bitable_app_id: ''       # 企业自建应用 App ID（推荐通道）
  bitable_app_secret: ''   # 企业自建应用 App Secret
  bitable_app_token: ''    # 多维表格 App Token（wiki 链接解析出的 obj_token）
  bitable_table_id: ''     # 数据表 ID（tbl...）
  bitable_sync_with_push: true
  bitable_user_token: ''   # 备选：用户 access token（会过期，仅用于临时排查）
  # 写入后端：auto / http / lark_cli
  #   http     —— 直连开放平台（app 凭据或 user_token）
  #   lark_cli —— 交给 lark-cli 写，认证与 token 续期由 lark-cli 负责
  #   auto     —— 有 app 凭据走 http，否则走 lark_cli
  bitable_backend: auto
  bitable_lark_cli_identity: user   # user = 当前授权用户，bot = 绑定应用
  bitable_lark_cli_path: ''         # 留空自动探测；launchd 的 PATH 很短，建议显式指定
  bitable_levels: [high, medium, low]  # 哪些等级自动写入表格
  bitable_cooldown_minutes: 5       # 同一用户两次写表最小间隔
  bitable_pull_interval_minutes: 5  # 多久把飞书表里销售改过的状态拉回本地
outreach:
  enabled: false           # 抖音触达（搜人 + 作品留言）开关
  auto_mode: false
  daily_limit: 30          # 每日留言上限，防风控
  min_delay: 45.0          # 两次留言最小间隔（秒）
  max_delay: 120.0         # 两次留言最大间隔（秒）
  max_per_run: 10
  comments_per_user: 1
  fail_stop_threshold: 3   # 连续失败几次自动停止
  message_template: '看到你在{live_room}聊到{model}，我们门店在售同款车型，方便留个联系方式细聊吗？'
  timeout: 30